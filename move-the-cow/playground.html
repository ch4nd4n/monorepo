<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Playground | Move the Cow</title>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <script type="module" src="/src/playground.js"></script>

    <main class="mx-auto max-w-5xl px-6 py-10">
      <h1 class="text-3xl font-bold">Tailwind Playground</h1>
      <p class="mt-2 text-slate-600">
        Edit this file directly to experiment with Tailwind classes without writing HTML in JavaScript.
      </p>

      <section class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <article class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
          <h2 class="text-lg font-semibold">Card example</h2>
          <p class="mt-2 text-sm text-slate-600">Use this page as a visual scratchpad.</p>
          <button class="mt-4 rounded-md bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">
            Example button
          </button>
        </article>

        <article class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
          <h2 class="text-lg font-semibold">Board tile example</h2>
          <div class="mt-3 grid grid-cols-4 gap-2">
            <div class="flex h-14 w-14 items-center justify-center rounded border border-slate-300 bg-white">🐄</div>
            <div class="h-14 w-14 rounded border border-slate-300 bg-white"></div>
            <div class="h-14 w-14 rounded border border-slate-300 bg-emerald-50"></div>
            <div class="h-14 w-14 rounded border-2 border-rose-400 bg-white"></div>
          </div>
        </article>
        <article class="p-5 border rounded-xl" id="board">
          <span class="bg-amber-300 p-5 rounded-xl border-2">🐄</span>
        </article>
      </section>
    </main>
  </body>
</html>
